services:
  master:
    build:
      context: ..
      dockerfile: services/Dockerfile.spark
    command: ["/usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "master"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/workspace:ro
      - ../artifacts/full/cluster:/work-output
  worker:
    build:
      context: ..
      dockerfile: services/Dockerfile.spark
    command: ["/usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1g", "spark://master:7077"]
    depends_on:
      - master
    volumes:
      - ..:/workspace:ro
      - ../artifacts/full/cluster:/work-output
