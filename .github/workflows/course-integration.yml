name: Course integration examples
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'course_support.py'
      - 'rag_support.py'
      - 'services/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/course-integration.yml'
permissions:
  contents: read
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
# Test không cần key cloud/model API, không tải LLM, không deploy dịch vụ.
